<title id="t">HYDRA-UMC-BRIDGE-UAV architecture</title>
<desc id="d">HYDRA-UMC-BRIDGE-UAV maps a correlated cell job onto a named high-level flight request, asks the shared evaluate_job gate of HYDRA-UMC-SDK and sends the approved request to a camera-equipped UAV as a real MAVLink command, signed when a key is given. A link-loss state machine and the bridge's own ground-station heartbeat decide return-to-launch or land when the vehicle goes silent.</desc>
