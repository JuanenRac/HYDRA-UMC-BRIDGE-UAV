[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hydra-umc-bridge-uav"
version = "0.1.6"
description = "Fail-safe HYDRA-UMC to UAV (camera-equipped drone) coordination boundary"
requires-python = ">=3.11"
license = {text = "GPL-3.0-or-later"}
dependencies = [
  "hydra-umc-sdk @ git+https://github.com/JuanenRac/HYDRA-UMC-SDK.git@v0.4.1#subdirectory=clients/python"
]

[project.optional-dependencies]
# Only open_mavlink_connection() needs this - it's imported lazily (see
# mavlink_transport.py's own comment) so the rest of the package, including
# every safety-relevant command-building/gating test, works without it
# installed.
mavlink = ["pymavlink>=2.4"]

[project.scripts]
hydra-umc-bridge-uav = "hydra_umc_bridge_uav.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff.lint]
select = ["F", "E9", "B"]

[tool.mypy]
ignore_missing_imports = true
