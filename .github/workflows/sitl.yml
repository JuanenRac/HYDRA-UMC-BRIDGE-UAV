# Copyright (C) 2026 JuanenRac (Electro Hobby 3D) <electrohobby3d@gmail.com>
# GPL-3.0-or-later - see LICENSE
#
# Only runs when started by hand (Actions > Run workflow): it pulls a large simulator image and is not part of the normal checks.
# It starts PX4 SITL in a container, lets the bridge open the link and keep its heartbeat going, and passes when the heartbeat
# of the simulator was heard. It sends nothing else to the vehicle.
# =============================================================================
name: Autopilot simulator check (optional)
on:
  workflow_dispatch:
    inputs:
      image:
        description: "Container image of a PX4 SITL that publishes MAVLink to the host on UDP 14550"
        default: "jonasvautherin/px4-gazebo-headless:1.14.3"
        required: true
permissions: {contents: read}
jobs:
  sitl:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with: {python-version: "3.12"}
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with: {repository: JuanenRac/HYDRA-UMC-SDK, path: .hydra-umc-sdk-contract, ref: v0.4.7, persist-credentials: false}
      - name: Install the bridge and pymavlink
        run: python -m pip install ./.hydra-umc-sdk-contract/clients/python . pymavlink
      - name: Start the simulator
        env:
          IMAGE: ${{ inputs.image }}
        run: |
          docker run -d --name px4 --network host "$IMAGE"
          sleep 45
          docker logs --tail 20 px4
      - name: Run the smoke test
        run: python tools/sitl_smoke.py --connection udpin:0.0.0.0:14550 --seconds 20 --open-timeout 60
      - name: Stop the simulator
        if: always()
        run: docker rm -f px4
